<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="880" viewBox="0 0 1800 880">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.title{font:700 30px Arial,sans-serif;fill:#0f172a}.box{stroke-width:2;rx:14;ry:14}.h{font:700 16px Arial,sans-serif;fill:#0f172a}.t{font:14px Arial,sans-serif;fill:#334155}.edge{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.note{font:13px Arial,sans-serif;fill:#475569}</style>
  </defs>
  <rect width="1800" height="880" fill="#fff"/>
  <text x="900" y="46" text-anchor="middle" class="title">No-Show Recovery Agent: Human-in-the-Loop Flow</text>

  <rect x="35" y="125" width="180" height="88" class="box" fill="#dbeafe" stroke="#60a5fa"/><text x="125" y="155" text-anchor="middle" class="h">Doctor</text><text x="125" y="180" text-anchor="middle" class="t">Mark No-show</text><text x="125" y="200" text-anchor="middle" class="t">+ Follow-up</text>
  <rect x="255" y="125" width="205" height="88" class="box" fill="#f8fafc" stroke="#64748b"/><text x="357" y="155" text-anchor="middle" class="h">Ticket Created</text><text x="357" y="180" text-anchor="middle" class="t">Run + trace only</text><text x="357" y="200" text-anchor="middle" class="t">No patient message</text>
  <rect x="500" y="125" width="210" height="88" class="box" fill="#fef3c7" stroke="#f59e0b"/><text x="605" y="155" text-anchor="middle" class="h">Admin Operations</text><text x="605" y="180" text-anchor="middle" class="t">Pipeline initially white</text><text x="605" y="200" text-anchor="middle" class="t">Waiting for Start</text>
  <rect x="750" y="125" width="180" height="88" class="box" fill="#fef3c7" stroke="#f59e0b"/><text x="840" y="158" text-anchor="middle" class="h">Admin Starts</text><text x="840" y="185" text-anchor="middle" class="t">Workflow</text>
  <rect x="970" y="125" width="215" height="88" class="box" fill="#ede9fe" stroke="#8b5cf6"/><text x="1077" y="155" text-anchor="middle" class="h">Trusted Context</text><text x="1077" y="180" text-anchor="middle" class="t">Appointment • patient</text><text x="1077" y="200" text-anchor="middle" class="t">doctor • available slots</text>
  <rect x="1225" y="125" width="215" height="88" class="box" fill="#fee2e2" stroke="#ef4444"/><text x="1332" y="155" text-anchor="middle" class="h">Policy + Dedupe</text><text x="1332" y="180" text-anchor="middle" class="t">Authorization • occurrence</text><text x="1332" y="200" text-anchor="middle" class="t">language resolution</text>
  <rect x="1480" y="125" width="245" height="88" class="box" fill="#dbeafe" stroke="#60a5fa"/><text x="1602" y="155" text-anchor="middle" class="h">OpenRouter AI</text><text x="1602" y="180" text-anchor="middle" class="t">Localized draft</text><text x="1602" y="200" text-anchor="middle" class="t">No tool execution</text>

  <rect x="1480" y="315" width="245" height="105" class="box" fill="#fef3c7" stroke="#f59e0b"/><text x="1602" y="345" text-anchor="middle" class="h">Validate Output</text><text x="1602" y="370" text-anchor="middle" class="t">Invalid → one retry</text><text x="1602" y="392" text-anchor="middle" class="t">Then localized fallback</text>
  <rect x="1210" y="315" width="225" height="105" class="box" fill="#ede9fe" stroke="#8b5cf6"/><text x="1322" y="345" text-anchor="middle" class="h">Persist Draft</text><text x="1322" y="370" text-anchor="middle" class="t">Plan + immutable hash</text><text x="1322" y="392" text-anchor="middle" class="t">Proposed action</text>
  <rect x="925" y="305" width="240" height="125" class="box" fill="#fef3c7" stroke="#f59e0b"/><text x="1045" y="338" text-anchor="middle" class="h">Await Admin Approval</text><text x="1045" y="365" text-anchor="middle" class="t">Exact localized preview</text><text x="1045" y="387" text-anchor="middle" class="t">Patient NOT notified</text><text x="1045" y="409" text-anchor="middle" class="t">Approval gate enforced</text>
  <rect x="675" y="315" width="200" height="105" class="box" fill="#fef3c7" stroke="#f59e0b"/><text x="775" y="347" text-anchor="middle" class="h">Admin Approves</text><text x="775" y="374" text-anchor="middle" class="t">Lock exact draft</text><text x="775" y="396" text-anchor="middle" class="t">+ content hash</text>
  <rect x="390" y="305" width="235" height="125" class="box" fill="#fee2e2" stroke="#ef4444"/><text x="507" y="337" text-anchor="middle" class="h">Final Safety Execution</text><text x="507" y="363" text-anchor="middle" class="t">Language recheck</text><text x="507" y="385" text-anchor="middle" class="t">Tool allowlist • idempotency</text><text x="507" y="407" text-anchor="middle" class="t">Delivery preparation</text>
  <polygon points="220,315 325,367 220,419 115,367" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="220" y="363" text-anchor="middle" class="h">Delivery Gate</text><text x="220" y="386" text-anchor="middle" class="t">all checks pass?</text>

  <rect x="250" y="565" width="260" height="105" class="box" fill="#dcfce7" stroke="#22c55e"/><text x="380" y="598" text-anchor="middle" class="h">Create One Patient Message</text><text x="380" y="624" text-anchor="middle" class="t">In-app notification only now</text><text x="380" y="647" text-anchor="middle" class="t">Exactly-once/idempotent</text>
  <rect x="600" y="565" width="280" height="105" class="box" fill="#dcfce7" stroke="#22c55e"/><text x="740" y="598" text-anchor="middle" class="h">Patient Sees Localized Update</text><text x="740" y="624" text-anchor="middle" class="t">No raw URL / UUID in message</text><text x="740" y="647" text-anchor="middle" class="t">Rebook button uses trusted metadata</text>
  <rect x="970" y="565" width="260" height="105" class="box" fill="#dcfce7" stroke="#22c55e"/><text x="1100" y="598" text-anchor="middle" class="h">Workflow Completed</text><text x="1100" y="624" text-anchor="middle" class="t">Run/action/trace terminal</text><text x="1100" y="647" text-anchor="middle" class="t">Visibility + dismissal audited</text>
  <rect x="1320" y="550" width="390" height="135" class="box" fill="#f8fafc" stroke="#64748b"/><text x="1515" y="584" text-anchor="middle" class="h">Important Reliability Rule</text><text x="1515" y="612" text-anchor="middle" class="t">The browser displays persisted stages only.</text><text x="1515" y="635" text-anchor="middle" class="t">It never authorizes approval or notification delivery.</text><text x="1515" y="658" text-anchor="middle" class="t">PostgreSQL remains the source of truth.</text>

  <path d="M215 169 H255" class="edge"/><path d="M460 169 H500" class="edge"/><path d="M710 169 H750" class="edge"/><path d="M930 169 H970" class="edge"/><path d="M1185 169 H1225" class="edge"/><path d="M1440 169 H1480" class="edge"/>
  <path d="M1602 213 V315" class="edge"/><path d="M1480 367 H1435" class="edge"/><path d="M1210 367 H1165" class="edge"/><path d="M925 367 H875" class="edge"/><path d="M675 367 H625" class="edge"/><path d="M390 367 H325" class="edge"/>
  <path d="M220 419 V500 H380 V565" class="edge"/><path d="M510 617 H600" class="edge"/><path d="M880 617 H970" class="edge"/>

  <text x="900" y="770" text-anchor="middle" class="note">Pre-approval and post-approval pipeline stages are presentation-paced, while actual backend timestamps remain truthful and durable.</text>
</svg>
