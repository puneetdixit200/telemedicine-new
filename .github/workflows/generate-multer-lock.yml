name: Generate Multer lock artifact

on:
  push:
    branches: [ fix/non-agent-production-hardening ]
    paths:
      - package.json
      - .github/workflows/generate-multer-lock.yml

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/non-agent-production-hardening

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched Multer is locked
        run: node -e "const lock=require('./package-lock.json'); const v=lock.packages?.['node_modules/multer']?.version; if(v!=='2.2.0') { throw new Error('Expected multer 2.2.0, got '+v); } console.log('multer',v);"

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh lockfile for Multer 2.2.0"
          git push origin HEAD:fix/non-agent-production-hardening

      - name: Upload lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock
          path: package-lock.json
          if-no-files-found: error
