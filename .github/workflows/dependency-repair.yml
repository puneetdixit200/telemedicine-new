name: Dependency repair validation

on:
  push:
    branches:
      - fix/production-e2e-2026-11-23
    paths:
      - .github/workflows/dependency-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/production-e2e-2026-11-23

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade vulnerable production dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact \
            next@16.4.6 \
            express@4.22.3 \
            morgan@1.12.1 \
            multer@2.5.0 \
            react-router-dom@7.18.6 \
            applicationinsights@3.17.1 \
            @prisma/client@6.19.3 \
            zod@4.6.7
          npm install --save-dev --save-exact prisma@6.19.3
          npm pkg set "overrides.deepmerge-ts=^8.0.1"
          npm pkg set "overrides.effect=3.22.5"
          npm pkg set "overrides.body-parser=1.20.9"
          npm pkg set "overrides.proxy-addr=2.0.8"
          npm pkg set "overrides.sharp=0.35.5"
          npm pkg set "overrides.source-map-js=1.2.4"
          npm pkg set "overrides.fast-xml-parser=5.12.1"
          npm pkg set "overrides.@grpc/grpc-js=1.14.7"
          npm install
          npm audit fix --omit=dev

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Commit validated dependency repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: patch production dependency vulnerabilities"
          git push origin HEAD:fix/production-e2e-2026-11-23
