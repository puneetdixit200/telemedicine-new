name: Refresh security lock

on:
  push:
    branches: [ fix/non-agent-production-hardening ]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/non-agent-production-hardening

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply semver-compatible security fixes only
        shell: bash
        run: |
          set +e
          npm audit fix --ignore-scripts
          audit_fix_status=$?
          set -e
          echo "npm audit fix exit code: $audit_fix_status (remaining lower-severity advisories are checked separately)"

      - name: Verify no high or critical production vulnerabilities remain
        run: npm audit --omit=dev --audit-level=high

      - name: Commit dependency updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply compatible dependency vulnerability fixes"
          git push origin HEAD:fix/non-agent-production-hardening
